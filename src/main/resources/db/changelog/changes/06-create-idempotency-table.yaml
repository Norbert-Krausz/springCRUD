databaseChangeLog:
  - changeSet:
      id: 06
      author: nk
      changes:
        - createTable:
            tableName: idempotency_records
            columns:
              - column:
                  name: key
                  type: VARCHAR(255)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: response_body
                  type: TEXT
                  constraints:
                    nullable: false

              - column:
                  name: status_code
                  type: INTEGER
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
